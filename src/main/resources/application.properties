# ===================================================================
# Spring Application Configuration
# ===================================================================
spring.application.name=ProjectBackEnd

# ===================================================================
# PostgreSQL Configuration (RAILWAY PRODUCTION)
# ===================================================================
# ระบบจะดึงค่าอัตโนมัติจากตัวแปรที่ Railway สร้างให้เมื่อเชื่อมต่อบริการเข้าด้วยกัน
spring.datasource.url=jdbc:postgresql://${{PostgreSQL.DATABASE_URL}}
spring.datasource.username=${{PostgreSQL.POSTGRES_USER}}
spring.datasource.password=${{PostgreSQL.POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / Hibernate Settings
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# Connection Pool (HikariCP Optimizations)
# ===================================================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ===================================================================
# SERVER CONFIGURATION
# ===================================================================
# ปลดคอมเมนต์ออกหากระบบของ Railway แจ้งว่าหาพอร์ตไม่เจอ (ปกติ Railway จะจัดการพอร์ตให้เอง)
# server.port=${PORT:8080}